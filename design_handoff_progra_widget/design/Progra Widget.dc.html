<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { base: 5047, since: Date.now(), paused: false, now: Date.now() };
  componentDidMount() { this.tick = setInterval(() => this.setState({ now: Date.now() }), 1000); }
  componentWillUnmount() { clearInterval(this.tick); }
  renderVals() {
    const p = this.props, s = this.state;
    const sec = s.paused ? s.base : s.base + Math.floor((s.now - s.since) / 1000);
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), ss = sec % 60;
    const pad = n => String(n).padStart(2, '0');
    const time = `${h}:${pad(m)}:${pad(ss)}`;
    const soft = { bg: 'rgba(255,255,255,.14)', ink: '#FFFFFF' }, solid = { bg: '#FFFFFF', ink: '#1C3A5E' };
    const pb = soft, sb = solid;
    return {
      time, paused: s.paused, running: !s.paused,
      timeInkGoal: s.paused ? '#8FA3BC' : '#A98BF5',
      pauseLabel: s.paused ? 'Resume' : 'Pause',
      pauseBg: pb.bg, pauseInk: pb.ink, stopBg: sb.bg, stopInk: sb.ink,
      togglePause: () => this.setState(st => st.paused
        ? { paused: false, since: Date.now(), now: Date.now() }
        : { paused: true, base: st.base + Math.floor((Date.now() - st.since) / 1000) }),
      stop: () => {}, // In the app: ends the session and opens Finish & Post (see README)
    };
  }
}
</script>
