<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#ffffff;}
a{color:#1c3a5e;} a:hover{color:#142c49;}
@keyframes flow-fade{from{opacity:0}to{opacity:1}}
</style>
</helmet>
<div style="min-height: 100dvh; background: #ffffff;">
  <sc-if value="{{ showLogin }}" hint-placeholder-val="{{ true }}">
    <div style="animation: flow-fade .4s ease both;">
      <dc-import name="Login" on-signed-in="{{ signedIn }}" hint-size="100%,100vh"></dc-import>
    </div>
  </sc-if>
  <sc-if value="{{ showOnboarding }}" hint-placeholder-val="{{ false }}">
    <div style="animation: flow-fade .4s ease both;">
      <dc-import name="Onboarding" hint-size="100%,100vh"></dc-import>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 420, &quot;height&quot;: 820}}">
class Component extends DCLogic {
  state = { phase: "login" };
  renderVals() {
    return {
      showLogin: this.state.phase === "login",
      showOnboarding: this.state.phase === "onboarding",
      signedIn: () => this.setState({ phase: "onboarding" }),
    };
  }
}
</script>
</body>
</html>
